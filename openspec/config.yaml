schema: spec-driven

context: |
  UmbraDB: a Midnight modular indexer. TypeScript (Node >=24), no ORM,
  hand-written SQL. A runner reads finalized blocks from a Midnight node's
  WebSocket RPC and commits each block in one transaction to PostgreSQL 18
  (or PGlite, for development and the browser). Transactions are parsed and
  applied by the vendored official `midnight-ledger` packages. A feature is a
  module: its tables, its callbacks for each block, its API; UmbraDB's own
  core modules use the same module API. The public tables are hashed into
  one deterministic contents hash; private modules run in their own
  processes with their own databases.

  Prior art already exists and MUST be read before writing any new spec:
  - openspec/changes/core-arch/ (proposal.md, design.md, specs/,
    acceptance.md): the 0.10.0 architecture every new change builds on.
  - Formal/STORAGE_ALGEBRA.md (the laws still in force: W1/P9 on the cursor
    table, and the half-open rule for height ranges).
  - AGENTS.md (the workflow, test and security rules) and ROADMAP.md.

  Correctness rule (carried over from the parent project's own convention):
  every external API/library claim MUST be verified against the actually
  installed dependency version or real upstream source, not assumed from
  training data or a prior research pass alone — cite file:line or a
  version-pinned doc URL. Several design docs in this repo already document
  real corrections found this way (a wrong SQL inequality, a misattributed
  lemma, schema gaps found by reading real MongoDB source directly) — that
  rigor is the standard to match, not the exception.

rules:
  proposal:
    - Every proposal must state what it does NOT cover (explicit non-goals),
      matching this project's existing proposal.md style.
    - One change is one independently deliverable feature, landed by one
      pull request. If the work bundles more than one, split it into
      separate changes now, at spec time; changes may depend on or be
      chained after each other, but each must stand on its own.
    - Every proposal opens with a status line, `> **Status:** <state>`,
      where <state> is one of Proposed, Approved, In progress, Blocked,
      Implemented, or Archived, optionally followed by a short note. Update
      it the moment the state changes, not at the end.
  design:
    - Cite openspec/changes/core-arch/design.md and
      Formal/STORAGE_ALGEBRA.md by section number wherever a new design
      decision touches an existing one - never silently duplicate or
      contradict them.
  tasks:
    - Each task must state its acceptance criteria concretely (what test
      passes, what command succeeds) - not just a description of work.
