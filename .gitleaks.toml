# gitleaks configuration for UmbraDB (v1.0.0-infosec-signoff, G18/G19).
#
# Drives the blocking full-history `gitleaks detect` step in .github/workflows/supply-chain.yml.
# Full-history mode is deliberate: the go-forward guard for the (valueless) committed Preview wallet
# secret is this scan, NOT a git-history rewrite (G19). Because there is no rewrite, the scan
# re-encounters that one historical secret on every run.

title = "UmbraDB gitleaks config"

[extend]
# Start from gitleaks' built-in rule set (AWS keys, private keys, generic high-entropy, etc.).
useDefault = true

[[rules]]
id = "umbradb-wallet-seed-hex"
description = "Wallet seed / secret-key material (64-char hex) in a seed- or key-named field"
# WHY THIS RULE EXISTS (found by negative-control testing, not by reading the config).
#
# The default `generic-api-key` rule fires on `nightSecretKeyHex` only because the FIELD NAME
# contains "SecretKey". It does NOT fire on `seedHex` -- there is no trigger keyword in that name.
# Verified empirically: a fresh 64-hex value in `nightSecretKeyHex` is caught, the identical value
# in `seedHex` is not. That gap is the wrong way round: the seed is the ROOT secret, from which
# generate-test-wallet.sh derives both the night secret key and the address.
#
# Field name accepts JSON ("seedHex"), single-quoted ('seedHex'), bare (seedHex:), and
# snake/kebab spellings (seed_hex, night_secret_key_hex, root-key) -- re-audit found `seed_hex`
# and single-quoted forms evading a narrower earlier pattern. Value is 64 hex in either quote
# style, case-insensitive.
regex = '''(?i)["']?[a-z0-9_-]*(seed|secret|private[_-]?key|root[_-]?key)[a-z0-9_-]*["']?\s*[:=]\s*["']([0-9a-fA-F]{64})["']'''
secretGroup = 2
keywords = ["seed", "secret", "privatekey", "private_key", "rootkey", "root_key"]

# The all-zero placeholder is NOT a secret -- but this exception is scoped to the committed
# template PATH. Re-audit found the previous rule-wide allowlist permitted an all-zero (i.e.
# fully predictable, therefore compromised) seed ANYWHERE in the tree, which is precisely the
# credential state this gate should refuse.
[[rules.allowlists]]
description = "All-zero placeholder, ONLY in the committed .example template."
# `condition = "AND"` is REQUIRED and is the whole point of this block. Gitleaks defaults an
# allowlist with multiple criteria to OR, so `paths` + `regexes` without it means "exempt this
# path OR this value ANYWHERE" -- the all-zero seed would stay globally exempt and the path
# scoping would be decorative. Verified by negative control: with OR the zero seed is missed on
# an arbitrary path; with AND it is caught there and still allowed in the template.
condition = "AND"
paths = ['''^nix/midnight-env/test-wallets/preview-test-wallet\.example\.json$''']
regexes = ['''^0{64}$''']

# NO GLOBAL PATH ALLOWLIST. (Audit finding, fixed.)
#
# This file previously allowlisted two whole paths. A `paths` allowlist is a GLOBAL, permanent
# exemption for everything on that path -- so a real key later force-added to
# preview-test-wallet.json, or pasted into the TRACKED .example template that people actually edit,
# would have been invisible to the one gate meant to catch exactly that.
#
# The single historical secret is instead suppressed by its EXACT fingerprint in `.gitleaksignore`
# (commit:path:rule:line) -- a one-finding exemption. Any new or different secret, on any path
# including those two, fails the gate.

# The RFC 6455 example WebSocket nonce (base64 of "the sample nonce"), which two test helpers send
# in hand-written upgrade requests and the stock generic-api-key rule matches on the header's name.
# It is the spec's own published example of a per-connection nonce, never a credential anywhere.
# `condition = "AND"` scopes the exemption: only this exact value, and only under test/ — any other
# value in those files, and this value outside test/, still fails the gate. This covers the
# working-tree `gitleaks dir` scan of the scan workflow, where line numbers drift and the
# commit-pinned fingerprints in .gitleaksignore (which guard the full-history `detect` scan at the
# commits that added the lines) never match.
[[allowlists]]
description = "RFC 6455 example WebSocket nonce in test helpers"
condition = "AND"
paths = ['''^test/''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
