name: Vendored ledger builds

# Rebuild every vendored ledger package (vendor/ledger/) from its pinned upstream commit and patches, in the pinned build image
# (vendor/ledger/Dockerfile), and fail if any built file differs from the SHA-256 recorded in that version's
# SHA256SUMS, or if the committed pkg/ does. Each runner builds with the image's native toolchain (the Rust image is
# pinned by its multi-architecture index digest); both architectures must give the recorded bytes, which is what makes
# the build reproducible on any host rather than on one machine.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Pull requests by number, pushes by ref.
  group: vendored-ledger-${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    name: rebuild (${{ matrix.version }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        version: [v8, v9-rc3, v9]
    runs-on: ${{ matrix.runner }}
    # A cold build (image, then the ledger crate graph with LTO) takes minutes on a hosted runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Rebuild and compare with SHA256SUMS
        # No `npm ci`: the script is bash and Docker only. The version comes in through the environment, never spliced
        # into the script.
        env:
          VERSION: ${{ matrix.version }}
          VENDOR_LEDGER_KEEP: ${{ runner.temp }}/rebuilt
        run: npm run vendor:ledger -- "$VERSION"

      - name: Keep the differing build
        # A rebuild that differs from SHA256SUMS is uploaded, so its bytes can be compared with the committed pkg/.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-${{ matrix.version }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/rebuilt
          if-no-files-found: ignore
          retention-days: 14
