name: Conformance trust gate

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # F5 (audit finding): the Pg-only conformance suite (`test/postgres/**`, `test/db/**` and the
    # other database suites) uses testcontainers (`@testcontainers/postgresql`), which
    # starts its OWN disposable Postgres container via the Docker daemon already present on
    # ubuntu-latest runners -- no `services: postgres` block is needed or used. This is the
    # required merge gate; it never runs the env-gated live tier (`test:live`), which needs a real
    # preprod network, a funded seed, and a built midnight-wallet checkout none of which are
    # available (or wanted) in CI (`design.md` §7.4). TransactionHistory's tests, the live tier among
    # them, are kept in `legacy/transaction-history/` outside this run (core-arch task 17.1, LS-3).
    #
    # Timeout posture (v1.0.0-recovery-testing Task 7.1): the crash (~26s), soak (~73s) and
    # differential (~10s) suites now RUN in this gate (Testcontainers, `UMBRADB_LIVE_PREPROD`
    # unset), plus v8 coverage instrumentation. Measured wall-clock for the whole deterministic set
    # is ~100s on a 24-core host; on a 4-core runner with coverage it is comfortably single-digit
    # minutes, so the soak stays in THIS job and `timeout-minutes: 30` is kept (no split needed).
    # StrykerJS mutation is a SEPARATE still-required job (below) so its cost never competes with
    # this one's clock.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Chrome for the browser build's tests
        # core-arch task 16.1 (A129–A132): `test/browser/` drives the runner image's Google Chrome headless over the
        # DevTools protocol (`test/browser/chrome.ts`; no test dependency). Its version is printed for the record.
        run: |
          google-chrome --version
          echo "UMBRADB_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Run conformance gate (tests + coverage + required-test skip-enforcement)
        # `npm run test:conformance` is now `scripts/conformance-gate.mjs` (Task 7.1): it runs
        # `vitest run --coverage` with `UMBRADB_LIVE_PREPROD` UNSET (so the crash/soak/differential
        # suites execute and do NOT self-skip), emits a Jest-compatible JSON report, then runs the
        # `check-required-tests.ts` reconciliation over that report. The gate fails if EITHER a test
        # fails, a `vitest.config.ts` coverage threshold (§2.3/§3.6 durability floors) is missed, OR
        # any manifest `"required"` id did not execute-and-pass (a re-introduced `describe.skipIf`
        # turns the gate red BY ID, not by luck). The one `WHERE`-gated optional-feature id
        # (`crash.pg-kill-save.no-duplicate-with-idempotency-key`) is in the manifest's `"deferred"`
        # section and reconciles as `skipped-pending-feature` — it does NOT fail the gate.
        #
        # Suites that ALWAYS self-skip in CI (reported SKIPPED, never silently counted as passed;
        # none are `"required"` manifest ids, so they cannot make the reconciliation red):
        #   - test/integration/chain-archive-replay-decode.integration.test.ts (needs a built
        #     sibling midnight-wallet checkout + a captured indexer SQLite DB, absent in CI).
        # A green CI run therefore says NOTHING about those suites beyond clean collection.
        run: npm run test:conformance

  mutation:
    # The StrykerJS mutation gate (openspec/changes/core-arch design.md §13, task 17.2): a SEPARATE still-required job
    # (never optional, never live-gated) so mutation cost is off the `test` job's clock. SCOPE: the nine targets
    # `stryker.conf.json` mutates (graph, dispatch, history, cbor, digest, height-versioned, cursor-table, sweep,
    # node-source), each with its fast tests in `vitest.mutation.config.ts`; `break` is 65 on the AGGREGATE over
    # valid mutants, which `scripts/mutation-per-adapter.mjs` sums over one `stryker run --mutate <file>` per target.
    #
    # RUNTIME / TIMEOUT (task 17.3): task 17.2 measured `npm run test:mutation:ci` at about 58 min in all (3,163 valid
    # mutants; node-source alone 1,446 s with 121 timed-out mutants, graph 1,068 s, cbor 494 s) on a loaded 24-core
    # machine with Stryker's fixed `concurrency: 3`. The 45 minutes this job had for 0.9.5's five adapters (~23 min)
    # would end the gate before its verdict, so the job has 120 minutes: about twice the measurement, for a slower
    # runner. Uses Testcontainers through the runner's Docker daemon, like the `test` job.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run StrykerJS mutation gate (nine targets, one run each; aggregate break:65)
        run: npm run test:mutation:ci
