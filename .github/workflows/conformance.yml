name: Conformance trust gate

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shard:
    # Each shard runs a slice of the test files (by path hash, not duration) and uploads a blob report; the `test`
    # job merges them. Postgres comes from Testcontainers on the runner's Docker; the live tier never runs here.
    strategy:
      fail-fast: false # let every shard finish, so one run reports every failure
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8] # the shard count is this list's length
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Chrome for the browser build's tests
        run: |
          google-chrome --version
          echo "UMBRADB_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Run conformance gate (one shard)
        # Coverage floors and the required-tests check run in the `test` job, on the merged reports.
        env:
          UMBRADB_CONFORMANCE_DEADLINE_MS: "3000000" # 50 min, under the job timeout; catches a hung worker
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:conformance -- "--shard=$SHARD"

      - name: Upload the shard's blob report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true # the directory is hidden, so it is skipped without this
          if-no-files-found: error
          retention-days: 1

      - name: Why a run failed (out-of-memory kills, memory, containers)
        # A dead worker or container prints nothing; this tells an OOM kill from a crash.
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::Kernel out-of-memory kills"
          sudo dmesg --ctime | grep -iE "out of memory|oom-kill|killed process" || echo "none in the kernel log"
          echo "::endgroup::"
          echo "::group::Memory"
          free -m
          echo "::endgroup::"
          echo "::group::Containers"
          docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "::endgroup::"

  test:
    # The required check: merges the shards, then fails on any failed test, missed coverage floor or required test
    # that didn't pass.
    needs: shard
    # Run even when a shard failed: a skipped required check counts as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Every shard passed
        # The merge can't tell: a shard that never uploaded is just missing from it.
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::The conformance shards ended '$SHARDS', not 'success'; see the shard jobs."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Download the shards' blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-blob-*
          path: .vitest-reports/
          merge-multiple: true

      - name: Run conformance gate (merge shards, coverage floors, required tests)
        run: npm run test:conformance -- --merge-reports
