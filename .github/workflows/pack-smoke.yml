name: Pack-install smoke test

# The packed-tarball smoke test (`test/smoke/pack-install.mjs`; openspec/changes/core-arch task 17.3, design.md §12
# and §13): it `npm pack`s UmbraDB, installs the tarball in a throwaway project and, from there, type-checks a consumer
# of every export of design.md §12, checks that 0.9.5's retired names and TransactionHistory's fail to type-check, that
# a deep import is blocked by the strict `exports` map, that the tarball ships the vendored ledger packages and nothing
# of legacy/, runs the installed `umbradb` command (usage, run, backup, restore, config check), and syncs a tape on
# PostgreSQL in Docker with `umbradb run` and `core-block-parsed` enabled.
#
# A SEPARATE workflow (not the required conformance gate), so its `npm pack` and install never run inside `vitest
# run`. Testcontainers starts its own PostgreSQL through the runner's Docker daemon (no `services:` block). Every
# oracle but the tape sync runs unconditionally; in CI a missing Docker FAILS the smoke (a required workflow must never
# report green having tested nothing); a local run without Docker skips only the sync.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pack-smoke-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Packed-tarball install smoke test (build -> pack -> install -> surface, command, tape sync)
        # `npm run test:smoke` runs `npm run build` first, then the smoke script. The tape sync needs Docker
        # (present on ubuntu-latest); in CI (`process.env.CI`) a missing Docker FAILS the job rather than skipping.
        run: npm run test:smoke
